spring:
  application:
    name: koda-backend

  profiles:
    active: dev

  datasource:
    url: jdbc:postgresql://localhost:5432/koda_db
    username: ${DB_USER:koda_user}
    password: ${DB_PASSWORD:koda_pass}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Flyway es el unico que modifica el esquema; Hibernate solo comprueba
      # que las entidades coincidan con las tablas.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  servlet:
    context-path: /api

koda:
  cors:
    # Origenes autorizados del navegador; separar con coma para agregar mas.
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  inference:
    url: ${INFERENCE_URL:http://localhost:8000}
  jwt:
    secret: ${JWT_SECRET:changeme_dev_secret_key_change_in_production}
    expiration-ms: 86400000

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html

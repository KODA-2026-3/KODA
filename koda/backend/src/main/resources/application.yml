spring:
  application:
    name: koda-backend

  profiles:
    active: dev

  datasource:
    # Configurable para usar una base remota; por defecto, PostgreSQL local.
    url: ${DB_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:koda_db}}
    username: ${DB_USER:koda_user}
    password: ${DB_PASSWORD:koda_pass}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      # Margen sobre los 10 MB del SRS para que el validador responda el mensaje propio.
      max-file-size: 11MB
      max-request-size: 12MB

  mail:
    # Vacio: el codigo de recuperacion se escribe en el log (desarrollo).
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      # Flyway es el unico que modifica el esquema; Hibernate solo comprueba
      # que las entidades coincidan con las tablas.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080
  tomcat:
    # Sin esto Tomcat corta la conexion ante un archivo demasiado grande y el
    # navegador no recibe el mensaje de error (RF-02).
    max-swallow-size: -1
  servlet:
    context-path: /api

koda:
  cors:
    # Origenes autorizados del navegador; separar con coma para agregar mas.
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  inference:
    url: ${INFERENCE_URL:http://localhost:5000}
    connect-timeout-ms: 3000
    # Por debajo de los 30 s de RD-03 para responder antes del limite (ADR-02).
    read-timeout-ms: ${INFERENCE_TIMEOUT_MS:25000}
  analisis:
    tamano-maximo: 10MB
    # Dias que se conservan la radiografia y el mapa de calor para volver a abrir
    # un resultado; despues se borran y queda solo el registro del analisis.
    retencion-dias: ${RETENCION_DIAS:7}
    # Cada hora, en el minuto 0: borra las radiografias vencidas.
    limpieza-cron: "0 0 * * * *"
  correo:
    remitente: ${MAIL_FROM:no-reply@koda.local}
    # Direccion de la aplicacion web que se incluye en los correos.
    url-frontend: ${FRONTEND_URL:http://localhost:4200}
  recuperacion:
    vigencia-minutos: 15
    # Espera minima entre codigos para la misma cuenta: evita llenarle el buzon.
    espera-segundos: 60
  jwt:
    secret: ${JWT_SECRET:changeme_dev_secret_key_change_in_production}
    expiration-ms: 86400000

management:
  health:
    # El endpoint es publico: el indicador de disco expondria rutas del servidor.
    diskspace:
      enabled: false
    # Sin SMTP configurado reportaria DOWN y ocultaria el estado real del sistema.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /docs
  swagger-ui:
    path: /swagger-ui.html

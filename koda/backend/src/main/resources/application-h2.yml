# Perfil alternativo: H2 en memoria, para levantar el backend sin PostgreSQL.
# Uso: mvnw spring-boot:run "-Dspring-boot.run.profiles=h2"
# Los datos se pierden al reiniciar y DatosIniciales vuelve a sembrar las cuentas.
logging:
  level:
    com.koda: DEBUG

spring:
  datasource:
    url: jdbc:h2:mem:koda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

# Perfil alternativo: H2 en memoria, para levantar el backend sin PostgreSQL.
# Uso: mvnw spring-boot:run "-Dspring-boot.run.profiles=h2"
# Los datos se pierden al reiniciar y DatosIniciales vuelve a sembrar las cuentas.
logging:
  level:
    com.koda: DEBUG

spring:
  datasource:
    url: jdbc:h2:mem:koda;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    # application.yml fija el dialecto de PostgreSQL: sin esto, Hibernate genera
    # SQL que H2 rechaza (insert ... returning id) y no se puede guardar un analisis.
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  h2:
    console:
      enabled: true
      path: /h2-console
